name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./... -timeout 900s
      - name: build (linux/amd64, static)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags '-s -w' -o /tmp/pig ./cmd/pig
      - name: e2e
        run: ./test/e2e.sh
